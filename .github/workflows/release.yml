name: Release

# Gera os instaladores das 3 plataformas e publica num release (rascunho).
# Dispare criando uma tag `vX.Y.Z` (ex.: `git tag v0.1.0 && git push --tags`)
# ou manualmente em Actions > Release > Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # macOS: .zip do código-fonte + guia
          - os: ubuntu-22.04     # Linux x64: .deb e .rpm
          - os: windows-latest   # Windows x64: instalador .exe (Inno Setup)

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fileknight_flutter
    steps:
      - uses: actions/checkout@v4

      # O macOS só zipa o código-fonte, então não precisa do Flutter.
      - name: Setup Flutter
        if: matrix.os != 'macos-latest'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------------- Linux
      - name: Linux — dependências
        if: matrix.os == 'ubuntu-22.04'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev \
            rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Linux — build + pacotes .deb/.rpm
        if: matrix.os == 'ubuntu-22.04'
        run: |
          flutter pub get
          flutter build linux --release
          bash packaging/linux/build_packages.sh

      # -------------------------------------------------------------- Windows
      - name: Windows — build
        if: matrix.os == 'windows-latest'
        run: |
          flutter pub get
          flutter build windows --release

      - name: Windows — instalador (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\fileknight.iss" "/DAppVersion=$version"

      # ---------------------------------------------------------------- macOS
      - name: macOS — zip do código-fonte
        if: matrix.os == 'macos-latest'
        run: bash packaging/macos/build_zip.sh

      # -------------------------------------------------------------- Release
      - name: Publicar no release (rascunho)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-build{0}', github.run_number) }}
          name: FileKnight ${{ github.ref_type == 'tag' && github.ref_name || format('(build {0})', github.run_number) }}
          body: "Baixe o instalador da sua plataforma nos assets abaixo."
          files: fileknight_flutter/dist/*
