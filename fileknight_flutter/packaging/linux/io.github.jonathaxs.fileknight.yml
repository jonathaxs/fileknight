app-id: io.github.jonathaxs.fileknight
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: fileknight

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # O FileKnight copia arquivos que o usuário escolher, então precisa de acesso amplo ao home.
  - --filesystem=home

modules:
  - name: fileknight
    buildsystem: simple
    build-commands:
      # 'bundle' deve ser a saída de `flutter build linux --release`,
      # copiada para o lado deste manifesto antes do build (ver packaging/README.md).
      - mkdir -p /app/lib/fileknight
      - cp -r bundle/* /app/lib/fileknight/
      - ln -s /app/lib/fileknight/fileknight /app/bin/fileknight
      - install -Dm644 io.github.jonathaxs.fileknight.desktop /app/share/applications/io.github.jonathaxs.fileknight.desktop
      - install -Dm644 io.github.jonathaxs.fileknight.metainfo.xml /app/share/metainfo/io.github.jonathaxs.fileknight.metainfo.xml
      - install -Dm644 io.github.jonathaxs.fileknight.png /app/share/icons/hicolor/512x512/apps/io.github.jonathaxs.fileknight.png
    sources:
      - type: dir
        path: .
